name: Build Lumen Presence installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            ext: .exe
          - os: ubuntu-latest
            name: linux
            ext: ""
          - os: macos-latest
            name: macos
            ext: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[build]"
      - run: pyinstaller --noconfirm --clean --windowed --onefile --name Lumen-Presence-${{ matrix.name }} src/lumen_presence/desktop_entry.py
      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-Presence-${{ matrix.name }}
          path: dist/Lumen-Presence-${{ matrix.name }}${{ matrix.ext }}
